spring.application.name=backend

spring.datasource.url=${COLLEGEASSIST_DB_URL:jdbc:mysql://localhost:3306/collegeassist}
spring.datasource.username=${COLLEGEASSIST_DB_USER:root}
spring.datasource.password=${COLLEGEASSIST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AI Assistant Integration Boundary (Google Gemini)
# Leave blank or supply via GEMINI_API_KEY environment variable. Never hardcode secrets.
# Configurable model (default: gemini-3.8-flash; override via GEMINI_MODEL environment variable)
collegeassist.ai.gemini-api-key=${GEMINI_API_KEY:}
collegeassist.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
collegeassist.ai.connect-timeout-seconds=${COLLEGEASSIST_AI_CONNECT_TIMEOUT:15}
collegeassist.ai.request-timeout-seconds=${COLLEGEASSIST_AI_REQUEST_TIMEOUT:30}

# Knowledge Base Document Repository
# Path to markdown files directory (resolved relative to working directory or project root)
collegeassist.knowledge.base-path=${COLLEGEASSIST_DOCS_PATH:docs}

# Knowledge Base Retrieval & Lexical Scoring
# Relevance score threshold for groundable document context
collegeassist.retrieval.min-score-threshold=${COLLEGEASSIST_RETRIEVAL_THRESHOLD:10.0}
collegeassist.retrieval.top-k=${COLLEGEASSIST_RETRIEVAL_TOP_K:3}
